controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    use_sim_time: true

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: MPU6050sensor
    frame_id: imu

joint_trajectory_controller:
  ros__parameters:
    joints:
      - right_previous_leg_joint
      - left_previous_leg_joint
      - right_leg_joint
      - left_leg_joint
      - right_calf_joint
      - left_calf_joint
      - right_foot_joint
      - left_foot_joint

    command_joints:
      - right_previous_leg_joint
      - left_previous_leg_joint
      - right_leg_joint
      - left_leg_joint
      - right_calf_joint
      - left_calf_joint
      - right_foot_joint
      - left_foot_joint

    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 1000.0
    state_publish_rate: 1000.0  # Hz
    allow_nonzero_velocity_at_trajectory_end: true

    gains:
      right_previous_leg_joint:
        angle_wraparound: false
        d: 0.0
        ff_velocity_scale: 0.0
        i: 1.0
        i_clamp: 0.0
        p: 77.7
      left_previous_leg_joint:
        angle_wraparound: false
        d: 0.0
        ff_velocity_scale: 0.0
        i: 1.0
        i_clamp: 0.0
        p: 77.7
      right_leg_joint:
        angle_wraparound: false
        d: 0.0
        ff_velocity_scale: 0.0
        i: 1.0
        i_clamp: 0.0
        p: 77.7
      left_leg_joint:
        angle_wraparound: false
        d: 0.0
        ff_velocity_scale: 0.0
        i: 1.0
        i_clamp: 0.0
        p: 77.7
      right_calf_joint:
        angle_wraparound: false
        d: 0.0
        ff_velocity_scale: 0.0
        i: 1.0
        i_clamp: 0.0
        p: 77.7
      left_calf_joint:
        angle_wraparound: false
        d: 0.0
        ff_velocity_scale: 0.0
        i: 1.0
        i_clamp: 0.0
        p: 77.7
      right_foot_joint:
        angle_wraparound: false
        d: 0.0
        ff_velocity_scale: 0.0
        i: 1.0
        i_clamp: 0.0
        p: 77.7
      left_foot_joint:
        angle_wraparound: false
        d: 0.0
        ff_velocity_scale: 0.0
        i: 1.0
        i_clamp: 0.0
        p: 77.7
